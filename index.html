<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>look_tech4 — проекты и техно-контент</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#12131a;--muted:#5d6275;--a:#00c2d1;--b:#ff2d6f;--line:rgba(0,0,0,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b12;--card:#13151f;--text:#f2f4fa;--muted:#99a0b8;--line:rgba(255,255,255,.09);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0b12;--card:#13151f;--text:#f2f4fa;--muted:#99a0b8;--line:rgba(255,255,255,.09);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;overflow-x:hidden}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55;pointer-events:none}
main,header,footer{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-weight:700}
nav a{color:var(--text);text-decoration:none;margin-left:16px;font-weight:500;color:var(--muted)}
.hero{display:grid;justify-items:center;text-align:center;padding:40px 0 60px}
.ava{position:relative;width:150px;height:150px;border-radius:50%;cursor:pointer;animation:float 5s ease-in-out infinite}
.ava::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--a));animation:spin 4s linear infinite;filter:blur(1px)}
.ava::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:inherit;filter:blur(22px);opacity:.5;background:conic-gradient(var(--a),var(--b),var(--a));animation:spin 4s linear infinite;z-index:-1}
.ava .in{position:absolute;inset:0;border-radius:50%;background:var(--card);border:4px solid var(--bg);display:grid;place-items:center;font-size:44px;font-weight:800;overflow:hidden;z-index:1}
.ava img{width:100%;height:100%;object-fit:cover}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
h1{font-size:clamp(34px,7vw,58px);margin:14px 0 6px;line-height:1.1}
h1 span,.grad{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.type{min-height:1.6em;font-size:19px;color:var(--muted)}
.type::after{content:"|";animation:blink 1s steps(1) infinite;color:var(--a)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:700;text-decoration:none;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));transition:transform .2s,box-shadow .2s;border:0;cursor:pointer;font-size:15px}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 28px rgba(255,45,111,.35)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
h2{font-size:30px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;transition:transform .15s,box-shadow .3s;transform-style:preserve-3d;position:relative;overflow:hidden}
.card:hover{box-shadow:0 16px 40px rgba(0,194,209,.18)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(250px circle at var(--mx,50%) var(--my,0%),rgba(0,194,209,.16),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover::before{opacity:1}
.icon{font-size:38px;display:inline-block;animation:float 3.5s ease-in-out infinite}
.card h3{margin:10px 0 6px}
.card p{color:var(--muted);margin:0 0 14px;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tags span{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.card .btn{padding:9px 16px;font-size:14px}
.rev{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}
.rev.on{opacity:1;transform:none}
.about{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;margin-bottom:60px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:16px}
.stats b{display:block;font-size:30px}
footer{text-align:center;color:var(--muted);padding:30px 20px 50px;font-size:14px}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rev{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header>
  <nav><div class="grad">@look_tech4</div><div><a href="#projects">Проекты</a><a href="#about">Обо мне</a></div></nav>
  <section class="hero">
    <div class="ava" id="ava" title="Нажми, чтобы загрузить аватарку"><div class="in" id="avaIn">LT</div></div>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="hint">Нажми на аватарку, чтобы поставить своё фото</div>
    <h1>look<span>_tech4</span></h1>
    <div class="type" id="type"></div>
    <div class="btns">
      <a class="btn" href="https://www.tiktok.com/@look_tech4" target="_blank" rel="noopener">Открыть TikTok</a>
      <a class="btn ghost" href="#projects">Мои проекты ↓</a>
    </div>
  </section>
</header>
<main>
  <section id="projects">
    <h2 class="rev">Мои <span class="grad">проекты</span></h2>
    <div class="grid" id="grid"></div>
  </section>
  <section id="about" class="about rev">
    <h2>Обо <span class="grad">мне</span></h2>
    <p style="color:var(--muted);margin:0">Делаю техно-контент и проекты в TikTok. Здесь можно посмотреть мои работы и скачать их с GitHub.</p>
    <div class="stats">
      <div><b data-n="2">0</b><span style="color:var(--muted)">проекта</span></div>
      <div><b data-n="100">0</b><span style="color:var(--muted)">% идей</span></div>
      <div><b data-n="24">0</b><span style="color:var(--muted)">часа на связи</span></div>
    </div>
  </section>
</main>
<footer>© look_tech4 · сделано с ❤️</footer>

<script>
// ===== ИЗМЕНИ ЗДЕСЬ СВОИ ПРОЕКТЫ =====
// url — ссылка на GitHub (репозиторий или Releases). Когда пришлёшь ссылку, подставим её.
var PROJECTS=[
  {icon:"📱",title:"Techtok",desc:"HTML-приложение для Android. Открой репозиторий на GitHub и скачай.",tags:["HTML","Android","APK"],url:"https://github.com/semensdobnov-ops/Techtok-html-app"},
  {icon:"🖼️",title:"BoyKisser Wallpaper",desc:"Живые обои. Архив скачивается сразу, одним нажатием.",tags:["Обои","ZIP"],url:"https://github.com/semensdobnov-ops/Boykisserwallpaper/raw/main/BoyKisserWallpaper.zip"}
];
var PHRASES=["Техно-контент и крутые проекты","Показываю, как это работает","Скачивай и пробуй сам"];

// Проекты
var grid=document.getElementById("grid");
PROJECTS.forEach(function(p,i){
  var c=document.createElement("div");c.className="card rev";c.style.transitionDelay=(i*80)+"ms";
  c.innerHTML='<div class="icon" style="animation-delay:'+(i*.4)+'s">'+p.icon+'</div><h3></h3><p></p><div class="tags"></div><a class="btn dl" target="_blank" rel="noopener">⬇ Скачать</a> <a class="btn ghost repo" target="_blank" rel="noopener">GitHub</a>';
  c.querySelector("h3").textContent=p.title;c.querySelector("p").textContent=p.desc;
  p.tags.forEach(function(t){var s=document.createElement("span");s.textContent=t;c.querySelector(".tags").appendChild(s)});
  c.querySelector(".dl").href=p.url;c.querySelector(".repo").href=p.url.replace(/\/raw\/.*$/,"");
  c.addEventListener("mousemove",function(e){var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");
    c.style.transform="perspective(700px) rotateX("+((.5-y)*8)+"deg) rotateY("+((x-.5)*8)+"deg)"});
  c.addEventListener("mouseleave",function(){c.style.transform=""});
  grid.appendChild(c);
});

// Появление при скролле + счётчики
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("on");
  e.target.querySelectorAll("[data-n]").forEach(function(el){var n=+el.dataset.n,v=0,st=setInterval(function(){v+=Math.max(1,Math.ceil(n/40));if(v>=n){v=n;clearInterval(st)}el.textContent=v},30)});
  io.unobserve(e.target)}})},{threshold:.15});
document.querySelectorAll(".rev").forEach(function(el){io.observe(el)});

// Печатающийся текст
(function(){var el=document.getElementById("type"),pi=0,ci=0,del=false;
 function tick(){var t=PHRASES[pi];el.textContent=t.slice(0,ci);
  if(!del&&ci<t.length){ci++;setTimeout(tick,70)}
  else if(!del){del=true;setTimeout(tick,1400)}
  else if(ci>0){ci--;setTimeout(tick,35)}
  else{del=false;pi=(pi+1)%PHRASES.length;setTimeout(tick,300)}}
 tick()})();

// Аватарка: загрузка своего фото (сохраняется в браузере)
var ava=document.getElementById("ava"),file=document.getElementById("file"),avaIn=document.getElementById("avaIn");
function setAva(src){avaIn.innerHTML="";var im=new Image();im.src=src;im.alt="Аватарка";avaIn.appendChild(im)}
try{var s=localStorage.getItem("lt4_ava");if(s)setAva(s)}catch(e){}
ava.addEventListener("click",function(){file.click()});
file.addEventListener("change",function(){var f=file.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){setAva(r.result);try{localStorage.setItem("lt4_ava",r.result)}catch(e){}};r.readAsDataURL(f)});

// Фон из частиц
(function(){var cv=document.getElementById("bg"),cx=cv.getContext("2d"),W,H,P=[];
 function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
 for(var i=0;i<60;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5});
 (function d(){cx.clearRect(0,0,W,H);
  P.forEach(function(p,i){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
   cx.fillStyle="#00c2d1";cx.beginPath();cx.arc(p.x,p.y,2,0,6.3);cx.fill();
   for(var j=i+1;j<P.length;j++){var q=P[j],dx=p.x-q.x,dy=p.y-q.y,dd=dx*dx+dy*dy;
    if(dd<14000){cx.strokeStyle="rgba(255,45,111,"+(1-dd/14000)*.5+")";cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}});
  requestAnimationFrame(d)})()})();
</script>
</body>
</html>
